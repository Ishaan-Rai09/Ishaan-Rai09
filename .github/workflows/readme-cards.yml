name: Refresh README cards
on:
  schedule: [{ cron: "30 1 * * *" }]   # daily, ~07:00 IST
  workflow_dispatch:
  push:
    paths: ["scripts/**", "fonts/**"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Ishaan-Rai09
        run: python scripts/fetch_contributions.py
      - name: Render README cards
        run: python scripts/render_readme_cards.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "chore: refresh README cards" && git push
