<svg xmlns="http://www.w3.org/2000/svg" width="300" height="210" viewBox="0 0 300 210" role="img"><style>
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes pop{from{opacity:0;transform:scale(0)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes sweep{from{transform:scaleX(0)}}
@keyframes fade{from{opacity:0}}
@keyframes swing{0%{opacity:0;transform:translateY(60px) rotate(-6deg)}70%{transform:translateY(-6px) rotate(1deg)}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes pulse{50%{opacity:.3}}
.r{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}
.f{animation:fade .6s ease-out backwards}
.p{transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out backwards}
.g{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards}
.s{transform-box:fill-box;transform-origin:left;animation:sweep .7s ease-out backwards}
.sw{transform-box:fill-box;transform-origin:center;animation:swing .9s cubic-bezier(.2,.8,.2,1) backwards}
.n{animation:nudge 1.8s ease-in-out infinite}
.pl{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g class="sw" style="animation-delay:1.60s">
<rect x="2" y="2" width="296" height="206" rx="18" fill="#fffdf7" stroke="#14110f" stroke-width="1.5"/>
<rect x="28" y="28" width="36" height="6" rx="3" fill="#1f4fff"/>
<text x="28" y="56" font-family="'EmbSans','Geist',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2" fill="#14110f">BUILD</text>
<text x="28" y="88" font-family="'EmbSerif','Instrument Serif',Georgia,'Times New Roman',serif" font-size="25" fill="#14110f">Mandi-Relay</text>
<text x="28" y="108" font-family="'EmbSans','Geist',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#14110f">Voice-first agricultural</text><text x="28" y="130" font-family="'EmbSans','Geist',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#14110f">marketplace for India.</text>
<text x="28" y="182" font-family="'EmbSans','Geist',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6b645a">Next.js · Supabase · Voice AI</text>
<g class="n" transform="translate(250 176)"><path d="M0 0H22M14 -6L22 0L14 6" fill="none" stroke="#14110f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<circle class="pl" cx="268" cy="32" r="8" fill="#1f4fff"/>
</g></svg>